services:
  postgres:
    image: postgres:16-alpine
    container_name: sockpuppet-postgres
    environment:
      POSTGRES_USER: sockpuppet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sockpuppet_dev_password}
      POSTGRES_DB: sockpuppet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sockpuppet']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sockpuppet-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sockpuppet-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sockpuppet-network
    restart: unless-stopped

  # Applies database migrations, then exits
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: sockpuppet-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sockpuppet:${POSTGRES_PASSWORD:-sockpuppet_dev_password}@postgres:5432/sockpuppet
    networks:
      - sockpuppet-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sockpuppet-app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sockpuppet:${POSTGRES_PASSWORD:-sockpuppet_dev_password}@postgres:5432/sockpuppet
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    networks:
      - sockpuppet-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Scale with: docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sockpuppet:${POSTGRES_PASSWORD:-sockpuppet_dev_password}@postgres:5432/sockpuppet
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    networks:
      - sockpuppet-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sockpuppet-network:
    driver: bridge
